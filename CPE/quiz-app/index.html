<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19324a">
  <title>CPE 模擬クイズ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">PROJECT MANAGEMENT</p>
      <h1>CPE 模擬クイズ</h1>
      <p>標準100問と上級50問で、理解度を段階的に確認できます。</p>
    </header>

    <section id="start-screen" class="panel">
      <h2>出題設定</h2>
      <div class="settings-grid">
        <label>
          問題セット
          <select id="bank-select">
            <option value="standard">標準編（100問）</option>
            <option value="advanced">上級編（50問）</option>
          </select>
        </label>
        <label>
          出題範囲
          <select id="chapter-select">
            <option value="all">全範囲</option>
            <option value="1">第1章</option>
            <option value="2">第2章</option>
            <option value="3">第3章</option>
            <option value="4">第4章</option>
            <option value="5">第5章</option>
          </select>
        </label>
        <label>
          問題数
          <select id="count-select">
            <option value="10">10問</option>
            <option value="20">20問</option>
            <option value="50">50問</option>
            <option value="100">全問</option>
          </select>
        </label>
      </div>
      <label class="check-row">
        <input id="shuffle-check" type="checkbox" checked>
        問題をランダムに並べる
      </label>
      <button id="start-button" class="primary">クイズを始める</button>
      <button id="retry-mistakes-button" class="secondary hidden">前回の間違いだけ復習</button>
      <p id="load-status" class="status">問題を読み込んでいます…</p>
    </section>

    <section id="quiz-screen" class="panel hidden">
      <div class="quiz-meta">
        <span id="question-counter">1 / 10</span>
        <span id="score-counter">正解 0</span>
      </div>
      <div class="progress-track"><div id="progress-bar"></div></div>
      <p id="question-type" class="badge"></p>
      <h2 id="question-text"></h2>
      <div id="options" class="options"></div>
      <button id="answer-button" class="primary">回答する</button>
      <div id="feedback" class="feedback hidden" aria-live="polite"></div>
      <button id="next-button" class="primary hidden">次の問題へ</button>
    </section>

    <section id="result-screen" class="panel hidden">
      <p class="eyebrow">RESULT</p>
      <h2 id="result-title">結果</h2>
      <p id="result-score" class="result-score"></p>
      <p id="result-message"></p>
      <div class="result-actions">
        <button id="result-retry-button" class="primary">同じ条件でもう一度</button>
        <button id="result-mistakes-button" class="secondary hidden">間違いだけ復習</button>
        <button id="back-button" class="text-button">設定へ戻る</button>
      </div>
    </section>
  </main>
  <script src="app.js?v=3"></script>
</body>
</html>
